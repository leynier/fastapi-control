[tool.poetry]
name = "fastapi-control"
version = "0.5.0"
description = "FastAPI utility to implement class-based routing with controllers and dependency injection."
authors = ["Leynier Gutiérrez González <leynier41@gmail.com>"]
homepage = "https://github.com/leynier/fastapi-control"
repository = "https://github.com/leynier/fastapi-control"
documentation = "https://github.com/leynier/fastapi-control"
readme = "README.md"
license = "MIT"
keywords = ["fastapi", "controller", "class-based-routing", "dependency-injection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

[tool.poetry.urls]
Changelog = "https://github.com/leynier/fastapi-control/blob/main/CHANGELOG.md"
Issues = "https://github.com/leynier/fastapi-control/issues"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.141.1,<2.0.0"
kink = ">=0.9.0,<0.10.0"

[tool.poetry.group.dev.dependencies]
fastapi = {extras = ["all"], version = ">=0.141.1,<2.0.0"}
pytest = ">=9.1.1,<10.0.0"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.4.0"
ruff = "^0.16.3"
mypy = "^2.3.0"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # function call in argument defaults: required by the FastAPI `Default(...)` idiom
]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
